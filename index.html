<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deposombe — Small Mac apps</title>
  <meta name="description" content="Deposombe makes small Mac apps that take the unnecessary steps out of everyday work.">
  <link rel="canonical" href="https://deposombe.com/">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Deposombe">
  <meta property="og:title" content="Deposombe — Less in your way.">
  <meta property="og:description" content="Deposombe makes small Mac apps that take the unnecessary steps out of everyday work.">
  <meta property="og:url" content="https://deposombe.com/">
  <meta property="og:image" content="https://deposombe.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Deposombe. Less in your way.">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Deposombe",
      "url": "https://deposombe.com/",
      "logo": "https://deposombe.com/apple-touch-icon.png",
      "description": "Deposombe makes small Mac apps that take the unnecessary steps out of everyday work.",
      "sameAs": ["https://github.com/deposombe"]
    }
  </script>
  <link rel="preload" href="fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script src="vendor/canvas-confetti/confetti.browser.js" defer></script>
  <script src="bats.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      const saved = localStorage.getItem("theme");
      if (saved) document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="mark" href="/">Deposombe</a>
    <nav>
      <a href="https://github.com/deposombe">GitHub</a>
      <button class="theme" type="button" aria-label="Switch between light and dark">Light / Dark</button>
    </nav>
  </header>

  <main>
    <h1>Less in your way.</h1>
    <p class="intro">Deposombe makes small Mac apps that take the unnecessary steps out of everyday work.</p>
    <p class="soon">The first apps are on their way.</p>
  </main>

  <footer>
    <p>© 2026 Deposombe</p>
    <p>made with <button class="bats" type="button" aria-label="Release the bats">🦡</button> by <a href="https://deposombe.com">🦡</a></p>
  </footer>

  <script>
    document.querySelector(".theme").addEventListener("click", () => {
      const root = document.documentElement;
      const dark = root.dataset.theme
        ? root.dataset.theme === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    });
  </script>
</body>
</html>
